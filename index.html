<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coder5330</title>
    <meta name="description" content="Coder5330 — projects on GitHub. A terminal you can actually type into.">
    <style>
      :root{
        --bg: #0d0b08;
        --panel: #161310;
        --panel-edge: #3a2c12;
        --amber: #ffb000;
        --amber-bright: #ffd27a;
        --amber-dim: #8a5c14;
        --amber-dim2: #5c4110;
        --red: #ff5f56;
        --white: #f5f0e6;
        --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
      }
    
      *{ box-sizing: border-box; }
    
      html, body{
        height: 100%;
      }
    
      body{
        margin: 0;
        background: var(--bg);
        color: var(--amber);
        font-family: var(--mono);
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1rem;
      }
    
      .crt{
        position: relative;
        width: 100%;
        max-width: 760px;
      }
    
      .scanlines{
        pointer-events: none;
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255,176,0,0.035) 0px,
          rgba(255,176,0,0.035) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: screen;
        z-index: 2;
      }
    
      .terminal{
        position: relative;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 60px rgba(0,0,0,0.5);
      }
    
      .terminal:focus-within{
        border-color: var(--amber-dim);
      }
    
      .term-bar{
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 0.9rem;
        border-bottom: 1px solid var(--panel-edge);
        background: #100d0a;
      }
    
      .dot{
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
        opacity: 0.7;
      }
      .dot-red{ background: var(--red); }
      .dot-amber{ background: var(--amber); }
      .dot-dim{ background: var(--amber-dim2); }
    
      .term-title{
        margin-left: 0.5rem;
        font-size: 0.75rem;
        color: var(--amber-dim);
        letter-spacing: 0.03em;
      }
    
      .term-body{
        height: 56vh;
        max-height: 480px;
        min-height: 280px;
        overflow-y: auto;
        padding: 1.1rem 1.1rem 0.2rem;
      }
    
      .term-body::-webkit-scrollbar{ width: 8px; }
      .term-body::-webkit-scrollbar-track{ background: transparent; }
      .term-body::-webkit-scrollbar-thumb{ background: var(--amber-dim2); }
    
      .line{
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.55;
        margin: 0 0 2px;
      }
    
      .line.cmd{ color: var(--amber-bright); }
      .line.cmd::before{ content: "guest@jldev:~$ "; color: var(--amber-dim); }
      .line.out{ color: var(--amber); }
      .line.bright{ color: var(--amber-bright); }
      .line.dim{ color: var(--amber-dim); }
      .line.dim2{ color: var(--amber-dim2); font-size: 0.85em; }
      .line.error{ color: var(--red); }
      .line a{ color: var(--white); text-decoration: none; border-bottom: 1px solid var(--amber-dim); }
      .line a:hover{ border-color: var(--white); }
    
      pre.banner{
        color: var(--amber-bright);
        margin: 0 0 0.75rem;
        font-size: 0.9em;
        line-height: 1.3;
      }
    
      .term-input-line{
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.1rem 0.9rem;
        border-top: 1px dashed var(--panel-edge);
      }
    
      .prompt{
        color: var(--amber-dim);
        flex-shrink: 0;
      }
    
      .cmd-input{
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--amber-bright);
        font: inherit;
        caret-color: var(--amber);
        min-width: 0;
      }
    
      .cmd-input::selection{ background: var(--amber-dim2); }
    
      .term-footer{
        text-align: center;
        margin-top: 0.9rem;
        font-size: 0.75rem;
      }
    
      .term-footer a{
        color: var(--amber-dim);
        text-decoration: none;
      }
      .term-footer a:hover{ color: var(--amber); }
    
      @media (max-width: 480px){
        body{ font-size: 13px; padding: 1rem 0.5rem; }
        .term-body{ height: 62vh; }
      }
    
      @media (prefers-reduced-motion: reduce){
        *{ scroll-behavior: auto !important; }
      }
    </style>
    </head>
    <body>
    
    <div class="crt">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="terminal">
        <div class="term-bar">
          <span class="dot dot-red"></span>
          <span class="dot dot-amber"></span>
          <span class="dot dot-dim"></span>
          <span class="term-title">guest@jldev: ~</span>
        </div>
        <div class="term-body" id="output" role="log" aria-live="polite"></div>
        <div class="term-input-line">
          <span class="prompt">guest@jldev:~$</span>
          <input id="cmd-input" class="cmd-input" type="text" autocomplete="off" spellcheck="false"
                 autocapitalize="off" autocorrect="off" aria-label="Terminal command input">
        </div>
      </div>
      <footer class="term-footer">
        <a href="https://github.com/Coder5330/Coder5330.github.io" target="_blank" rel="noopener">source</a>
      </footer>
    </div>
    
    <script src="script.js"></script>
    
    </body>
</html>
